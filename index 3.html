<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Random Voice Countdown</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #090b10;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
  }
  .app { width: 100%; max-width: 520px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #9aa1ad; margin: 0 0 22px; line-height: 1.45; }
  .panel {
    background: #141925;
    border-radius: 26px;
    padding: 42px 20px;
    border: 1px solid rgba(255,255,255,.08);
  }
  #counter {
    font-size: clamp(110px, 35vw, 190px);
    font-weight: 800;
    line-height: .9;
    letter-spacing: -.07em;
  }
  #status {
    margin-top: 20px;
    min-height: 22px;
    color: #9aa1ad;
    font-size: 14px;
  }
  button {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 19px 16px;
    border: 0;
    border-radius: 18px;
    font-size: 19px;
    font-weight: 700;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  #startBtn { background: #1688ff; color: white; }
  #resetBtn { background: #292f3a; color: white; }
  button:disabled { opacity: .45; }
  .small {
    margin-top: 18px;
    font-size: 12px;
    color: #777f8c;
  }
</style>
</head>
<body>
<div class="app">
  <h1>Random Voice Countdown</h1>
  <p>10 to 0, with a different random delay between every number.</p>

  <div class="panel">
    <div id="counter">10</div>
    <div id="status">Ready</div>
  </div>

  <button id="startBtn" type="button">Start Countdown</button>
  <button id="resetBtn" type="button">Reset</button>

  <div class="small">Maximum total countdown time: 20 seconds.</div>
</div>

<script>
(function () {
  var counter = document.getElementById("counter");
  var status = document.getElementById("status");
  var startBtn = document.getElementById("startBtn");
  var resetBtn = document.getElementById("resetBtn");

  var timers = [];
  var active = false;
  var generation = 0;

  function clearAllTimers() {
    for (var i = 0; i < timers.length; i++) {
      clearTimeout(timers[i]);
    }
    timers = [];
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) {
      status.textContent = "Speech not supported in this browser";
      return;
    }

    var u = new SpeechSynthesisUtterance(String(text));
    u.volume = 1;
    u.rate = 1.0;
    u.pitch = 1.0;

    var voices = window.speechSynthesis.getVoices();
    var chosen = null;

    for (var i = 0; i < voices.length; i++) {
      if (/^en-IE/i.test(voices[i].lang)) { chosen = voices[i]; break; }
    }
    if (!chosen) {
      for (var j = 0; j < voices.length; j++) {
        if (/^en-GB/i.test(voices[j].lang)) { chosen = voices[j]; break; }
      }
    }
    if (!chosen) {
      for (var k = 0; k < voices.length; k++) {
        if (/^en/i.test(voices[k].lang)) { chosen = voices[k]; break; }
      }
    }

    if (chosen) u.voice = chosen;

    window.speechSynthesis.speak(u);
  }

  function makeGaps(totalMs) {
    var count = 10;
    var minGap = 550;
    var remaining = totalMs - (minGap * count);
    var weights = [];
    var sum = 0;

    for (var i = 0; i < count; i++) {
      var w = 0.2 + Math.random() * 1.8;
      weights.push(w);
      sum += w;
    }

    var gaps = [];
    for (var j = 0; j < count; j++) {
      gaps.push(minGap + remaining * (weights[j] / sum));
    }
    return gaps;
  }

  function showNumber(n) {
    counter.textContent = String(n);
    speak(n);
  }

  function reset() {
    generation++;
    active = false;
    clearAllTimers();

    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }

    counter.textContent = "10";
    status.textContent = "Ready";
    startBtn.disabled = false;
  }

  function start() {
    if (active) return;

    generation++;
    var myGeneration = generation;
    active = true;
    clearAllTimers();

    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();

      // Prime iOS speech from the direct button tap.
      var prime = new SpeechSynthesisUtterance("");
      prime.volume = 0;
      window.speechSynthesis.speak(prime);
    }

    startBtn.disabled = true;
    status.textContent = "Running";

    // Random total duration from 11 to 20 seconds.
    var totalMs = 11000 + Math.random() * 9000;
    var gaps = makeGaps(totalMs);

    showNumber(10);

    var elapsed = 0;
    var n = 9;

    for (var index = 0; index < 10; index++) {
      elapsed += gaps[index];

      (function(number, delay) {
        var id = setTimeout(function() {
          if (!active || generation !== myGeneration) return;

          showNumber(number);

          if (number === 0) {
            active = false;
            startBtn.disabled = false;
            status.textContent = "Finished";
          }
        }, delay);

        timers.push(id);
      })(n, elapsed);

      n--;
    }
  }

  // onclick is deliberately used for maximum compatibility with local iOS files.
  startBtn.onclick = start;
  resetBtn.onclick = reset;

  // Load voice list where supported.
  if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function() {
      window.speechSynthesis.getVoices();
    };
  }
})();
</script>
</body>
</html>
